<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-time Chat</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 10px; background: #f5f5f5; }
    #header { display: flex; justify-content: space-between; align-items: center; background: #333; color: white; padding: 10px; border-radius: 8px; }
    #messages { 
      height: 65vh; 
      overflow-y: scroll; 
      border: 1px solid #ddd; 
      padding: 15px; 
      background: white; 
      border-radius: 8px;
    }
    .message { 
      margin: 12px 0; 
      padding: 10px; 
      border-radius: 12px; 
      max-width: 75%; 
      background: #f1f1f1; 
    }
    .own { 
      background: #dcf8c6; 
      margin-left: auto; 
      text-align: right; 
    }
    .img-preview {
      max-width: 100%;
      max-height: 300px;
      border-radius: 8px;
      margin: 8px 0;
      cursor: pointer;
    }
    #unread-badge {
      background: #ff3b30;
      color: white;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 50%;
      margin-left: 8px;
    }
    #typing { font-style: italic; color: #666; margin: 5px 0; }
  </style>
</head>
<body>
  <div id="header">
    <h2>Real-time Chat <span id="room-name"></span></h2>
    <div>
      <span id="unread-badge" style="display:none;">0</span>
    </div>
  </div>

  <input id="username" placeholder="Your Name" value="Zahid">
  <input id="room" placeholder="Room" value="general">
  <button onclick="joinRoom()">Join Room</button>

  <div id="messages"></div>
  <div id="typing"></div>

  <input id="input" placeholder="Type message..." onkeypress="if(event.key==='Enter') sendMessage()">
  <button onclick="sendMessage()">Send</button>
  <input type="file" id="fileInput" style="display:none" onchange="uploadFile()">
  <button onclick="document.getElementById('fileInput').click()">📎 Attach</button>

  <script>
    const socket = io();
    let username = '', room = '', unreadCount = 0;
    let isTabActive = true;

    // Track tab visibility
    document.addEventListener('visibilitychange', () => {
      isTabActive = !document.hidden;
      if (isTabActive) unreadCount = 0; // Reset when user comes back
      updateBadge();
    });

    function joinRoom() {
      username = document.getElementById('username').value.trim() || 'User';
      room = document.getElementById('room').value.trim() || 'general';

      document.getElementById('room-name').textContent = `• ${room}`;
      socket.emit('join', { username, room });
    }

    function sendMessage() {
      const msg = document.getElementById('input').value.trim();
      if (msg) {
        socket.emit('message', { message: msg });
        document.getElementById('input').value = '';
      }
    }

    function uploadFile() {
      const file = document.getElementById('fileInput').files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('file', file);

      fetch('/upload', { method: 'POST', body: formData })
      .then(res => res.json())
      .then(data => {
        socket.emit('message', {
          message: data.isImage ? '' : `Shared: ${data.fileName}`,
          fileUrl: data.fileUrl,
          fileName: data.fileName,
          isImage: data.isImage
        });
      });
    }

    // Render Message
    function renderMessage(data) {
      const messagesDiv = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = `message ${data.username === username ? 'own' : ''}`;

      let content = `<strong>${data.username}:</strong><br>`;

      if (data.isImage && data.fileUrl) {
        content += `<img src="${data.fileUrl}" class="img-preview" onclick="window.open('${data.fileUrl}', '_blank')">`;
      } else if (data.fileUrl) {
        content += `<a href="${data.fileUrl}" target="_blank">📎 ${data.fileName}</a>`;
      } else {
        content += data.message;
      }

      div.innerHTML = content;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    socket.on('message', (data) => {
      renderMessage(data);

      // Unread count logic
      if (!isTabActive || document.visibilityState === 'hidden') {
        unreadCount++;
        updateBadge();
      }
    });

    socket.on('previousMessages', (msgs) => {
      msgs.forEach(msg => {
        // Add isImage flag for old messages if needed
        if (msg.fileUrl) {
          const ext = msg.fileName ? msg.fileName.toLowerCase() : '';
          msg.isImage = ['.jpg','.jpeg','.png','.gif','.webp'].some(e => ext.endsWith(e));
        }
        renderMessage(msg);
      });
    });

    function updateBadge() {
      const badge = document.getElementById('unread-badge');
      if (unreadCount > 0) {
        badge.textContent = unreadCount > 99 ? '99+' : unreadCount;
        badge.style.display = 'inline-block';
      } else {
        badge.style.display = 'none';
      }
    }

    // Typing Indicator
    let typingTimeout;
    document.getElementById('input').addEventListener('input', () => {
      socket.emit('typing', { isTyping: true });
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => socket.emit('typing', { isTyping: false }), 800);
    });

    socket.on('typing', (data) => {
      document.getElementById('typing').textContent = data.isTyping ? `${data.username} is typing...` : '';
    });

    socket.on('userJoined', (data) => console.log(data.message));
    socket.on('userLeft', (data) => console.log(data.message));
  </script>
</body>
</html>
